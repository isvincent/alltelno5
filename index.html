<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>楊梅高中 分機通訊錄 (手機版)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #eff6ff;
      --dial-green: #16a34a;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Noto Sans TC', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: manipulation;
    }
    /* Hide scrollbars but keep functionality */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tap-active:active {
      transform: scale(0.96);
      transition: transform 0.1s ease;
    }
    .safe-bottom {
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);
    }
    .highlight-text {
      background-color: #fef08a;
      color: #854d0e;
      font-weight: 700;
      padding: 0 2px;
      border-radius: 2px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex justify-center selection:bg-blue-100 selection:text-blue-800">

    <!-- Toast Notification -->

    <!-- 1. Mobile Top Bar -->

      <div class="flex items-center justify-between gap-2 mb-2.5">
        <div>
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-1">
              楊梅高中
              <span class="text-xs font-normal text-sky-200">分機通訊錄</span>
            </h1>
          </div>
          <p class="text-[10px] text-sky-300 mt-0.5">總務處編製 • 113/09/07 版</p>
        </div>

        <!-- Quick Dial Operator Button -->
        <button 
          onclick="openTrunkModal()" 
          class="tap-active flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-1.5 rounded-full shadow-md border border-emerald-400/30 shrink-0"

            <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 4V3z"></path>

      </div>

      <!-- Mobile Search Bar -->

        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        <input 
          type="search" 
          id="search-input"

          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Quick Scroll Category Chips -->

        <button data-cat="all" class="cat-pill active px-3 py-1 rounded-full font-semibold transition shrink-0 bg-white text-blue-900 shadow-sm">
          全部

          <span>常用</span> <span id="fav-count" class="text-[9px] bg-white/30 px-1 rounded-full">0</span>
        </button>
        <button data-cat="行政處室" class="cat-pill px-3 py-1 rounded-full font-medium transition shrink-0 bg-white/20 hover:bg-white/30 text-white">
          行政處室
        </button>
        <button data-cat="導師與教師" class="cat-pill px-3 py-1 rounded-full font-medium transition shrink-0 bg-white/20 hover:bg-white/30 text-white">
          導師專任
        </button>
        <button data-cat="專科教室與實驗室" class="cat-pill px-3 py-1 rounded-full font-medium transition shrink-0 bg-white/20 hover:bg-white/30 text-white">

        <button data-cat="特教與輔導" class="cat-pill px-3 py-1 rounded-full font-medium transition shrink-0 bg-white/20 hover:bg-white/30 text-white">

        <button data-cat="場館與大樓設施" class="cat-pill px-3 py-1 rounded-full font-medium transition shrink-0 bg-white/20 hover:bg-white/30 text-white">
          御風場館

    </header>

    <!-- Search Status Bar -->

        </div>

        <button onclick="closeTrunkModal()" class="w-full py-2.5 text-center text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl tap-active">

    <!-- Modal: Multi-Extension Selector Action Sheet -->

    // Init
    function init() {
      updateFavCounts();
      renderContacts();
      setupEvents();

    // Update Favorites Counter UI
    function updateFavCounts() {
      const count = favorites.length;
      favCountEl.textContent = count;
      if (count > 0) {
        badgeFavEl.textContent = count;
        badgeFavEl.classList.remove('hidden');
      } else {
        badgeFavEl.classList.add('hidden');
      }
    }

    // Toggle Favorite
    function toggleFavorite(ext, title, dept, e) {
      if (e) e.stopPropagation();
      const index = favorites.indexOf(ext);
      if (index === -1) {
        favorites.push(ext);
        showToast(`已收藏分機 ${ext} (${title})`);
      } else {
        favorites.splice(index, 1);
        showToast(`已取消收藏分機 ${ext}`);
      }
      localStorage.setItem('ymsh_fav_exts', JSON.stringify(favorites));
      updateFavCounts();
      renderContacts();
    }

    // Toast Message
    let toastTimer;
    function showToast(msg) {
      clearTimeout(toastTimer);
      toastMessage.textContent = msg;
      toast.classList.remove('-translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-16', 'opacity-0');
      }, 2000);
    }

    // Copy Extension Number
    function copyExt(ext, title, dept, e) {
      if (e) e.stopPropagation();
      navigator.clipboard.writeText(ext).then(() => {
        showToast(`已複製分機 ${ext} (${dept || ''} ${title || ''})`);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = ext;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(`已複製分機 ${ext}`);
      });
    }

    function dialExt(extList, title, dept) {
      if (extList.length === 1) {
        // Direct mobile dial with Yangmei trunk
        window.location.href = `tel:034789618,${extList[0]}`;
      } else {
        // Open multi-extension selector
        openMultiExtModal(extList, title, dept);

    // Switch Bottom Tab
    function switchTab(tab) {
      currentTab = tab;
      
      // Tab styling
      const tabs = ['all', 'favorites', 'direct'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t === 'all' ? 'all' : t === 'favorites' ? 'fav' : 'direct'}`);
        if (!btn) return;
        if (t === tab) {
          btn.classList.add('text-blue-600');
          btn.classList.remove('text-slate-500');
        } else {
          btn.classList.remove('text-blue-600');
          btn.classList.add('text-slate-500');
        }
      });

      // Filter accordingly
      if (tab === 'favorites') {
        currentCategory = 'favorites';
        updatePillsUI('favorites');
      } else if (tab === 'direct') {
        renderDirectLinesView();
        return;
      } else {
        currentCategory = 'all';
        updatePillsUI('all');
      }

      renderContacts();
    }

    function updatePillsUI(cat) {
      document.querySelectorAll('.cat-pill').forEach(pill => {
        if (pill.getAttribute('data-cat') === cat) {
          pill.classList.add('bg-white', 'text-blue-900', 'font-semibold', 'active');
          pill.classList.remove('bg-white/20', 'text-white');
        } else {
          pill.classList.remove('bg-white', 'text-blue-900', 'font-semibold', 'active');
          pill.classList.add('bg-white/20', 'text-white');
        }
      });
    }

    // Highlight text
    function highlight(text) {
      if (!text) return '';
      if (!searchQuery.trim()) return escapeHTML(text);
      const q = searchQuery.trim();
      const escapedText = escapeHTML(text);
      const regex = new RegExp(`(${escapeRegExp(q)})`, 'gi');
      return escapedText.replace(regex, '<span class="highlight-text">$1</span>');
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Render Contacts List
    function renderContacts() {
      if (currentTab === 'direct') {
        renderDirectLinesView();
        return;
      }

      const query = searchQuery.trim().toLowerCase();
      let matchCount = 0;

      const filteredDepts = DIRECTORY_DATA.map(dept => {
        if (currentCategory !== 'all' && currentCategory !== 'favorites') {
          if (dept.category !== currentCategory) return null;
        }

        const filteredItems = dept.items.filter(item => {
          if (currentCategory === 'favorites') {
            const isFav = item.ext.some(e => favorites.includes(e));
            if (!isFav) return false;
          }

          if (!query) return true;

          const titleMatch = (item.title || '').toLowerCase().includes(query);
          const nameMatch = (item.name || '').toLowerCase().includes(query);
          const extMatch = item.ext.some(e => e.toLowerCase().includes(query));
          const deptMatch = (dept.department || '').toLowerCase().includes(query);
          const directMatch = (dept.directLine || '').toLowerCase().includes(query);

          return titleMatch || nameMatch || extMatch || deptMatch || directMatch;
        });

        if (filteredItems.length > 0) {
          matchCount += filteredItems.length;
          return {
            ...dept,
            items: filteredItems
          };
        }
        return null;
      }).filter(Boolean);

      // Handle search bar counters
      if (query) {
        searchStatusBar.classList.remove('hidden');
        searchCountEl.textContent = matchCount;
      } else {
        searchStatusBar.classList.add('hidden');
      }

      if (filteredDepts.length === 0) {
        contactsContainer.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      let html = '';
      filteredDepts.forEach(dept => {
        html += `
          <!-- Department Card -->
          <div class="bg-white rounded-2xl border border-slate-200/90 shadow-2xs overflow-hidden">
            
            <!-- Sticky Section Header -->
            <div class="bg-slate-50/90 px-3.5 py-2.5 border-b border-slate-100 flex items-center justify-between">
              <div class="flex items-center gap-1.5">
                <span class="w-1.5 h-3.5 rounded-full bg-blue-600 inline-block"></span>
                <h3 class="font-bold text-slate-900 text-xs tracking-tight">${highlight(dept.department)}</h3>
                <span class="text-[10px] text-slate-400 font-medium">(${dept.items.length})</span>
              </div>
              <div class="flex items-center gap-1.5 text-[10px]">
                ${dept.directLine ? `
                  <a href="tel:03${dept.directLine}" class="text-blue-700 bg-blue-50 border border-blue-200 px-1.5 py-0.5 rounded font-mono font-medium tap-active">
                    專線 03-${dept.directLine}
                  </a>
                ` : ''}
                ${dept.fax ? `
                  <span class="text-rose-700 bg-rose-50 border border-rose-200 px-1.5 py-0.5 rounded font-mono font-medium">
                    傳真 ${dept.fax}
                  </span>
                ` : ''}
              </div>
            </div>

            <!-- List items -->
            <div class="divide-y divide-slate-100">
              ${dept.items.map(item => {
                const isFav = item.ext.some(e => favorites.includes(e));
                const firstExt = item.ext[0];
                const hasMultiple = item.ext.length > 1;

                return `
                  <div class="p-3 flex items-center justify-between gap-2.5 hover:bg-slate-50/60 transition">
                    
                    <!-- Left: Title & Name -->
                    <div class="min-w-0 flex-1">
                      <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="font-semibold text-slate-900 text-xs sm:text-sm tracking-tight leading-snug">
                          ${highlight(item.title)}
                        </span>
                        ${item.name ? `
                          <span class="text-[11px] font-medium text-slate-600 bg-slate-100 px-1.5 py-0.2 rounded-md shrink-0">
                            ${highlight(item.name)}
                          </span>
                        ` : ''}
                      </div>

                      <!-- Extension Badges (Tap to copy) -->
                      <div class="flex items-center gap-1.5 mt-1">
                        ${item.ext.map(e => `
                          <button 
                            onclick="copyExt('${e}', '${escapeHTML(item.title)}', '${escapeHTML(dept.department)}', event)"
                            class="tap-active text-[11px] font-mono font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200/80 px-2 py-0.5 rounded-lg flex items-center gap-1 shadow-2xs"
                            title="點擊複製分機"
                          >
                            <span>${highlight(e)}</span>
                            <svg class="w-3 h-3 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                          </button>
                        `).join('')}
                      </div>
                    </div>

                    <!-- Right: Quick Actions (Dial & Fav) -->
                    <div class="flex items-center gap-1.5 shrink-0">
                      
                      <!-- Favorite Button -->
                      <button 
                        onclick="toggleFavorite('${firstExt}', '${escapeHTML(item.title)}', '${escapeHTML(dept.department)}', event)"
                        class="p-2 text-slate-300 hover:text-amber-500 rounded-xl tap-active transition ${isFav ? 'text-amber-500' : ''}"
                        title="${isFav ? '取消常用' : '加入常用'}"
                      >
                        <svg class="w-4 h-4 ${isFav ? 'fill-amber-500' : 'fill-none stroke-current'}" viewBox="0 0 20 20">
                          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                        </svg>
                      </button>

                      <!-- One-Tap Dial Button -->
                      <button 
                        onclick="dialExt(${JSON.stringify(item.ext)}, '${escapeHTML(item.title)}', '${escapeHTML(dept.department)}')"
                        class="tap-active flex items-center justify-center w-8 h-8 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm"
                        title="立即撥號"
                      >
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                          <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 4V3z"></path>
                        </svg>
                      </button>

                    </div>

                  </div>
                `;
              }).join('')}
            </div>

          </div>
        `;
      });

      contactsContainer.innerHTML = html;
    }

    // Clear Search Input
    function clearSearch() {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.add('hidden');
      searchStatusBar.classList.add('hidden');
      renderContacts();
      searchInput.focus();
    }

    // Setup Event Listeners
    function setupEvents() {
      // Search input
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        if (searchQuery.trim()) {
          clearSearchBtn.classList.remove('hidden');
        } else {
          clearSearchBtn.classList.add('hidden');
        }
        renderContacts();
      });

      clearSearchBtn.addEventListener('click', clearSearch);

      // Category pills
      document.querySelectorAll('.cat-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('.cat-pill').forEach(p => {
            p.classList.remove('bg-white', 'text-blue-900', 'font-semibold', 'active');
            p.classList.add('bg-white/20', 'text-white');
          });
          pill.classList.remove('bg-white/20', 'text-white');
          pill.classList.add('bg-white', 'text-blue-900', 'font-semibold', 'active');

          currentCategory = pill.getAttribute('data-cat');
          currentTab = currentCategory === 'favorites' ? 'favorites' : 'all';
          
          // Sync bottom tabs
          const tabAll = document.getElementById('tab-all');
          const tabFav = document.getElementById('tab-fav');
          if (currentCategory === 'favorites') {
            tabFav.classList.add('text-blue-600');
            tabFav.classList.remove('text-slate-500');
            tabAll.classList.remove('text-blue-600');
            tabAll.classList.add('text-slate-500');
          } else {
            tabAll.classList.add('text-blue-600');
            tabAll.classList.remove('text-slate-500');
            tabFav.classList.remove('text-blue-600');
            tabFav.classList.add('text-slate-500');
          }

          renderContacts();
        });
      });

      // Close modal on background tap
      trunkModal.addEventListener('click', (e) => {
        if (e.target === trunkModal) closeTrunkModal();
      });
      extSelectModal.addEventListener('click', (e) => {
        if (e.target === extSelectModal) closeExtModal();
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
